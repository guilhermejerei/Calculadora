<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora feita com HTML, CSS e JavaScript puro">
    <title>Calculadora</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="calculadora">
        <div class="area_resultado">
            <p id="resultado"></p>
        </div>
        <div class="area_entrada">
            <input id="entrada" type="text" readonly aria-label="Expressão matemática" aria-live="polite">
        </div>
        <div class="interface">
            <button data-valor="+" aria-label="Adicionar">+</button>
            <button data-valor="-" aria-label="Subtrair">-</button>
            <button data-valor="*" aria-label="Multiplicar">x</button>
            <button data-valor="/" aria-label="Dividir">/</button>

            <button data-valor="1" aria-label="Número 1">1</button>
            <button data-valor="2" aria-label="Número 2">2</button>
            <button data-valor="3" aria-label="Número 3">3</button>
            <button data-valor="%" aria-label="Porcentagem">%</button>

            <button data-valor="4" aria-label="Número 4">4</button>
            <button data-valor="5" aria-label="Número 5">5</button>
            <button data-valor="6" aria-label="Número 6">6</button>
            <button data-acao="backspace" aria-label="Apagar último caractere">DEL</button>

            <button data-valor="7" aria-label="Número 7">7</button>
            <button data-valor="8" aria-label="Número 8">8</button>
            <button data-valor="9" aria-label="Número 9">9</button>
            <button data-acao="clear" aria-label="Limpar tudo">AC</button>

            <button data-valor="0" aria-label="Número 0">0</button>
            <button data-valor="." aria-label="Ponto decimal">•</button>
            <button data-acao="calcular" class="enter" aria-label="Calcular resultado">=</button>
        </div>
    </div>

    <footer>
        <a href="https://github.com/guilhermejerei" target="_blank">
            <img class="logo" src="Logo.png" alt="Logo do autor Guilherme Jerei">
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
